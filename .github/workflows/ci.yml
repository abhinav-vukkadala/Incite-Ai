name: CI Pipeline - Incite AI

on:
  push:
    branches: ["develop", "main"]
  pull_request:
    branches: ["main"]

jobs:
  backend-check:
    name: Backend Linter & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Ruff linter (Syntax & Error check)
        run: |
          # Stops the build if there are Python syntax errors or undefined names
          ruff check . --select=E,F --target-version=py311

      - name: Run Pytest (if tests exist)
        run: |
          # Runs pytest if a tests/ folder or test files are found
          if [ -d "tests" ] || ls test_*.py 1> /dev/null 2>&1; then
            pytest
          else
            echo "No test files found, skipping pytest."
          fi
